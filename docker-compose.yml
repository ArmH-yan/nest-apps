# Local development infrastructure: PostgreSQL + S3-compatible file storage.
# Values come from the root `.env` (copy `.env.example`).
services:
  db:
    image: postgres:17
    container_name: nest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nest-pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Photo/file storage (ARCHITECTURE §24). RustFS speaks the S3 API; MinIO's
  # images are no longer published. Any S3 provider works in production.
  storage:
    image: rustfs/rustfs:1.0.1
    container_name: nest-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "9000:9000"
    volumes:
      - nest-storage:/data

volumes:
  nest-pgdata:
  nest-storage:
